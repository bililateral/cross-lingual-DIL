                  - generic [ref=e1032]: "请对附件进行实际独立科研结果外审。网页附件显示为review(5).zip，原文件review.zip为9,639,622字节、729成员，SHA-256：0d5e45250361558d6b2d66bca8815103e6f0657eeab9fb9d63a4bbbec50c5053。用户已明确授权本包上传。请先验证附件，再按下面完整请求实际阅读、独立计算并交付中文全文和必要证据ZIP。附件内历史“待上传授权”是打包时快照，已被本次授权取代。 # LOGIT0.1与risk正式结果联合外审请求 请按科研纪律对两个已结束固定开发点做实际独立结果审查。研究问题：新卖家群体持续到来、历史训练只能保留六完整群及全部附属状态≤1MiB时，学习新群体并保持旧分布未见卖家的马甲候选排序／基础识别。输入仅屏蔽标题／描述；中文合成三域、每群28账号、每查询27候选，单s0和ABC/BCA/CAB三个顺序。不是三个种子，也不是独立最终留出。 请先读docs/SELLER_ALIAS_LOGIT_RISK_RESULT.zh.md、两份固定合同和各自实际冻结来源，再核对原结果及新增保存结果核验。实现外审及主审为直接复用证据；不要重审未变历史或为找问题扩展成新研究／安全加固。此请求不授权接触服务器、真实文本／标签／缓存／模型、test、owners、私有身份资产或凭据，不授权新训练、参数搜索、消融或更改成功线。 ## 固定对象与本方待核结论 1. LOGIT0.1：L当前＋0.1L历史＋独立0.5 MSE；1728新更新、6终点、18新＋63旧指标集。主比较对ER0.1，另固定对LOGIT0.25及SEQ。本方复核分别23/23、23/23、20/23。对SEQ旧域MAP正向；N AP、Z MAP/AP原观察保护未满足，三者区间跨零，不能宣判总体退化或非劣效。 2. risk：L当前＋0.1L历史＋0.5 mean(D_rank,D_positive,D_negative)，风险按正例数分层、通道分别排序、只罚上升、来源参考冻结。1728新更新、6终点、18新＋81旧。risk对LOGIT0.1、ER0.1、SEQ、LOGIT0.25分别4/23、5/23、7/23、4/23。对LOGIT0.1的O/N/Z MAP均有负向证据；对ER0.1的O MAP区间跨零、N/Z负向。有效负结果，不自动归为实现无效，不否定整个方法家族。 3. 两项实际退出0、train/valid各一次、完整盲门前valid0、test/owners0、各约5小时20分钟。risk监听等待后启动、真实更新后自删、结束0，无重试。LOGIT0.1在risk统计前已完成，未触发延后finalize故障恢复。 ## 必须实际核查的内容 - 分开核对LOGIT37份与risk32份实际来源、各自policy及来源绑定，不能把当前主目录的后继实现冒充LOGIT冻结版本。核对共同首域model/Adam/RNG／首映射恢复、当前与历史日程、随机流、更新预算、完整盲门及校准计数。权重仅有Linux新鲜哈希和端点描述符，包中无权重，不能宣称网页重新加载了原生模型。 - 风险保持项是否实际接入，而非参数／日志形式满足；复用已关闭的原生梯度和独立手写证据，结合本轮正式调用、目标分解、更新和缓存来源。只在发现具体矛盾时扩大回查。 - 18套新矩阵完整性、60群／22列、raw/stage-cal/first-cal角色、63／81复用对照身份与risk预先绑定LOGIT0.1。全部七端点、按实际域分层整群配对5000次PCG64抽样及线性分位区间、原23项方向和零观察退化判据；另核对逐群／合并混淆整数和工作点，不把AP、PR-AUC、MAP混用。 - 从保存矩阵用独立公式或索引重算，不以本方audit通过、计数或SHA作为科学判断。只使用保存结果，不重开真值；AP/MAP的标签级重算范围限制须如实保留。 - 审核预定风险诊断的解释：同模型train/eval已存在保持惩罚；首更新隐藏头的negative梯度很小；γ同为0.5不表示与MSE等强度。检查报告是否明确“一群／四seed、仅首更新隐藏头范数、非全编码器、没有梯度角度和因果消融”，是否把线索误写成已证实退化主因。 - 审核结论是否准确回答研究问题，是否混淆有效性、局部正负效果、原验收、创新和外推。保持前轮数学泛函已有先例／代理不保证MAP/FPR的结论，不要求重新做无变化文献检索。不得建议用本批结果事后换成功线。 ## 附件阅读与复现 保留Windows仓库相对结构。两项结果分别在reports/seller_alias_continual/20261004/