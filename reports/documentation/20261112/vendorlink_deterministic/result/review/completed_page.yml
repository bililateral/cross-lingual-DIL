                      - heading "2. 辅助指标不会改变主裁决，但不应被概括为全部同向" [level=3] [ref=e1171]
                      - paragraph [ref=e1172]: 以下均为 detail.json 中对应方法、终态R格和指标的均值差，单位pp。
                      - paragraph [ref=e1173]:
                        - strong [ref=e1174]: 对旧Full：
                        - text: 三域MAP均提高，AlphaBay最终13项指标均值全部提高。但Dream的Recall@3、Recall@5、NDCG@5分别下降0.2123、1.0616、0.2595pp；Agora的Recall@3、NDCG@3、Recall@5、NDCG@5分别下降0.2667、0.0839、0.1143、0.0216pp。因此“局部改善”准确，“三域所有指标全面改善”不成立。
                      - paragraph [ref=e1175]:
                        - strong [ref=e1176]: 对ER/SEQ：
                        - text: Agora最终全部13项指标均值都较低，说明新域末态代价不限于宏F1。但AlphaBay宏F1相对ER/SEQ分别高0.0244/0.2625pp，而MAP分别低0.2039/0.1843pp；Dream Recall@10比ER、SEQ均高0.8493pp。故也不能写成“每个域、每个指标都输”。
                      - paragraph [ref=e1177]:
                        - strong [ref=e1178]: 对V_SET：
                        - text: 三域宏F1与MAP均较高，但Dream Recall@5和Recall@10均低1.2739pp，Recall@3均值持平。外部竞争力门基于旧域O的宏F1，通过该门不代表所有检索截断指标均优。
                      - paragraph [ref=e1179]: 原报告已经提示指标异向，未用单个辅助读数挽回主门失败。以上是值得保留的非阻断补充，没有发现能推翻其核心裁决而被遗漏的重要正向证据。
                      - heading "八、确定性分支的实际作用与机制解释边界" [level=2] [ref=e1180]
                      - heading "1. 实际代码支持“只改变出生MSE学生随机模式”" [level=3] [ref=e1181]
                      - paragraph [ref=e1182]: 为解释结果中的操作是否真实，定向追踪了 step35_vendorlink_account_methods.py：
                      - list [ref=e1183]:
                        - listitem [ref=e1184]: deterministic_student() 临时把encoder普通Dropout及BERT SDPA的dropout设零，用 fork_rng 和 finally 恢复随机状态及属性；保留训练/激活检查点路径。
                        - listitem [ref=e1185]: backward_h() 在确定性历史任务中按ER目标计算随机历史监督，移除该分支原出生MSE；当前H监督与RMS辅助CE、历史自然/重组监督仍保持原随机模式。
                        - listitem [ref=e1186]: backward_birth() 对同一历史群计算自然账号池分数，教师detach，目标为 beta*mse，没有再乘alpha；通过 pair_backward() 和 z.backward() 传播，确定性上下文覆盖检查点反算。
                        - listitem [ref=e1187]: update_account() 累积各分支梯度后只共同裁剪一次、主optimizer更新一次，辅助optimizer沿原规则。
                      - paragraph [ref=e1188]: "step29_vendorlink_methods.py 的pair头为Linear/ReLU/Linear；`teacher()/Memory.retain()` 对应eval出生教师和既有教师不刷新。`step35_vendorlink_account_run.py.execute()` 则在历史步骤检查确定性分支标记并累计 deterministic_history_groups。"
                      - paragraph [ref=e1189]: 这些与本轮冻结单一干预相符，没有发现重复计入MSE、学生断梯度或把整个训练长期切为eval的具体矛盾。本节仅解释结果所依赖的实际操作，不重新展开已关闭的实现资格审查。
                      - heading "2. 46,440次执行不等于46,440次全部非零" [level=3] [ref=e1190]
                      - paragraph [ref=e1191]: "R/history_summary.json[\"51\"/\"52\"/\"53\"] 分别记录 updates=23640、`birth_updates=15480`。每seed的阶段细项为："
