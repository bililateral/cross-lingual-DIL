                        - text: 首步零值仅属于
                        - strong [ref=e1216]: 出生分支
                        - text: "。`stages[\"2\"].history_supervised.first` 三seed均大于0，不能扩写为整个历史监督或全部历史梯度为零。原报告此句宜加上“出生分支”以避免歧义。"
                      - paragraph [ref=e1217]: 六个seed×后续阶段的保存均值也符合：
                      - paragraph [ref=e1218]: history_objective = alpha × history_supervised + birth_weighted；
                      - paragraph [ref=e1219]: birth_weighted ≈ beta × mse。
                      - paragraph [ref=e1220]: 前者最大残差约1.78×10⁻¹¹，后者约1.13×10⁻⁸，与浮点计算尺度相符，没有出现β误乘α或双重计入的数字迹象。
                      - heading "3. 正式调用与资格回执共同排除“空开关”，不证明性能收益" [level=3] [ref=e1221]
                      - paragraph [ref=e1222]: D/qualification/cpu01/receipt.json 记录独立梯度参考最大差0、旧路径/β0更新最大差0，以及手写实际入口9次更新、6次确定性历史消费。
                      - paragraph [ref=e1223]: "gpu01/receipt.json 记录真实BERT/SDPA、激活检查点、`deterministic_eval_max_abs=0`、`modes_restored=true`、`actual_updates=1`；隔离出生分支的encoder/pair梯度范数分别约0.001260662/0.080058560，并记录实际共同更新后的参数变化。"
                      - paragraph [ref=e1224]: 结合正式历史汇总，足以支持：
                      - blockquote [ref=e1225]:
                        - paragraph [ref=e1226]: 确定性出生评分分支在本轮实际执行，目标和反传连接有效，正式步骤产生了非零出生目标及记录表示梯度。
                      - paragraph [ref=e1227]: 它不单独量化每次正式Adam更新中出生项的净贡献，因为还有其他目标、共同裁剪和优化器状态；更不证明这些梯度改善了dev旧域保持能力。报告中的“产生保持作用”“保持确有作用”建议收紧为上述表述，属于非阻断措辞修正。
                      - heading "4. 不能把新旧训练差当成纯dropout噪声分解" [level=3] [ref=e1228]
                      - paragraph [ref=e1229]: B/mechanism/diagnosis/report.zh.md 中的模式诊断是在固定参数、固定记忆群上比较随机/eval学生。当前新旧Full之后走过不同参数轨迹，整阶段损失均值的差不再是同参数下的噪声量。
                      - paragraph [ref=e1230]: 旧Full的Dream历史目标均值为0.6421/0.8411/0.6992，新候选为0.6294/0.7816/0.7379，第三seed甚至更高。它支持“关闭该分支随机性后仍有明显保持约束，性能问题未解决”，不支持“已精确消除了多少有害噪声”，也不证明dropout完全无害或是唯一有害原因。
                      - paragraph [ref=e1231]: 旧报告的历史记录梯度包含监督和保持，本轮表格的出生分支梯度仅含出生项，不能直接作同口径梯度比例比较。当前也没有梯度夹角或各候选因素的隔离证据。固定β、绝对评分目标、Memory覆盖及与当前学习的相容性仍只是可能解释，不能据此宣布某个新β或新机制必然有效。
