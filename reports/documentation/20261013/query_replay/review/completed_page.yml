                        - paragraph [ref=e716]: 这只是表空间的局部保证。当前群仍使用完整S的A0/A1，共享参数仍有耦合；异来源记录也可能共享模板或其他无关条件。因此不能推成全局去捷径，更不能据此认定旧C的失败根因。
                        - paragraph [ref=e717]: 逐查询另建27个候选，确实避开了全图零来源重叠的退化：候选之间可以共享某原账号的不同记录，而本行不评分候选—候选边；不同查询行也不要求“候选j”保持同一组记录。代价是Q成为真正的有向列表表，而不是一张统一的无向合成账号图。
                        - paragraph [ref=e718]:
                          - text: 覆盖也应精确表述：固定8个K2和4个K3时，756个有向单元中有40个正例、716个负例。
                          - strong [ref=e719]: 16个K2正例没有候选重组变化，对应R权重严格为零；24个K3正例和716个负例具有非零分配方差系数。
