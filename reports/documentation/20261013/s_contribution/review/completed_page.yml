                        - heading "第 3.9 节的构造性比较：基本公允，但不宜强读" [level=3] [ref=f15e1107]
                        - paragraph [ref=f15e1108]: 将同控分量视作临时局部类别，是合理的原则映射；把袋分类转为关系排序，也不是不可比较的任务鸿沟。报告据此否定“集合评分、同类重组、输出保持分别都是原创组件”，是有依据的。
                        - paragraph [ref=f15e1109]:
                          - text: 但
                          - strong [ref=f15e1110]: 固定袋大小、无放回，并没有唯一确定联合采样分布
                          - text: 。独立为每个账号抽样、保留某个原袋、混合两个袋、对整个分量一次性守恒切分，会产生不同的账号间相关结构。S 的联合分配是真实选择，不是仅换名称。
                        - paragraph [ref=f15e1111]: 因此，S 仍可保留的窄贡献是：
                        - blockquote [ref=f15e1112]:
                          - paragraph [ref=f15e1113]: 在授权同控关系下，对完整局部身份分量实施记录守恒、槽大小不变的联合账号重组，以共享记录作用表支持原账号与重组账号的完整关系排序，并在有限历史条件下取得同架构开发收益。
                        - paragraph [ref=f15e1114]:
                          - text: 这可以是有价值的任务化设计。
                          - strong [ref=f15e1115]: 现阶段不足在于这条具体贡献链还薄，而不是因为它没有一个全新的通用算子。
