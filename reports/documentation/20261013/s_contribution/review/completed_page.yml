                        - heading "五、发现分类与最终处置" [level=2] [ref=f15e1696]
                        - paragraph [ref=f15e1697]: "**已证实科学错误：**本轮未发现需要撤销冻结实验的错误。"
                        - paragraph [ref=f15e1698]: "**复现／表述修订：**应补入 C²Aug 的近邻覆盖；明确完整旧表的“已保存”与“已消费”区别；补齐公式适用条件及 Multi-Instance Kernels 的归一化引用位置。这些不要求改训练代码。"
                        - paragraph [ref=f15e1699]: "**合理后续建议：**把主报告的账号共同条件问题进一步收窄到上述联合关系证据失配；未来候选必须给出实际分配／权重运算与退化情形。这仍是机制设计问题，不是新实验授权。"
                        - paragraph [ref=f15e1700]: "**无关过度设计：**本轮不要求更多 seed、重训所有近邻、打开封存真值、恢复旧 C 诊断或重审全部历史，也不把这些设为旧结果有效性的条件。"
