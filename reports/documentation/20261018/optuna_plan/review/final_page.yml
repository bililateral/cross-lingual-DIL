                - heading "四、最容易出现的伪实现，已经定位到实际入口" [level=2] [ref=f5e1118]
                - paragraph [ref=f5e1119]: 这部分不是要求重开旧实现审查。旧代码完成的是固定 s0、固定两臂实验；新方案改变了接口要求。
                - paragraph [ref=f5e1120]:
                  - strong [ref=f5e1121]: 第一，LR 必须进入逐步赋值。
                  - text: 现有更新函数每步重新设置 encoder LR 和 head LR，只改 optimizer 构造或配置字段会被覆盖。第 1、29、30、288 步的实际参数组值和日志，应来自同一个冻结 trial 规格。
                - paragraph [ref=f5e1122]:
                  - strong [ref=f5e1123]: 第二，lambda 必须进入全部规定位置。
                  - text: 它应作用于 current/history 的 A0/A1 四处 rank，随后保留历史监督 0.1 和独立的 0.5D0。不能漏掉 history，也不能将 D0 误缩为 0.05。S 仍须使用完整旧 rank 和完整训练结构。
                - paragraph [ref=f5e1124]:
                  - strong [ref=f5e1125]: 第三，新 seed 不能继续被旧 s0 门约束。
                  - text: 建议明确全部 36 次搜索固定使用初始化、训练日程、Memory 三个旧根：
                - paragraph [ref=f5e1126]: 20260909 / 20260918 / 20260930
                - paragraph [ref=f5e1127]: 复验使用方案预定的新根，但 fit/calibration 划分根 20260918 固定。Optuna sampler 的 20261018 应单独列出，不能混入训练随机根。
                - paragraph [ref=f5e1128]: 当前旧初始 hash、日程复核、Memory 抽样和冻结轨迹相等检查，都需要按这个新规格对应处理。新 seed 应核对其规定的预训练编码器、随机 head、空 Adam 和同 seed 三臂配对，不能要求它的完整初始化身份等于旧 s0。
                - paragraph [ref=f5e1129]:
                  - strong [ref=f5e1130]: 第四，原生增量需要具体六调用表。
                  - text: 现拟 300 秒 CPU、每臂六次原生调用的范围可以接受。应说明共同状态、默认/非默认配置、A/B 位置和恢复关系，使 lambda 与 LR 的作用可分别辨认。只看到两参数一起改变后的总损失或参数差，不足以证明两条接线。
                - paragraph [ref=f5e1131]: 这里也不能制造错误验收要求：在同一状态下只改变 LR，单步 Adam 一、二阶矩可以相同。需要证明的是实际 LR、梯度路径、更新和恢复关系。
