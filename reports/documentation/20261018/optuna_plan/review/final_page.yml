                - paragraph [ref=f5e1354]:
                  - text: 这是三个模型各自 MAP 差的平均，不是分数集成。域内的重复单位是
                  - strong [ref=f5e1355]: 40 个新群
                  - text: ，不能当作 120 个独立 seed×群样本，也不能当作独立查询。
                - paragraph [ref=f5e1356]: 按域整群配对 bootstrap 20,000 次，同一抽样索引保留候选、S 与全部 seed 的配对；四个单侧边界各使用 1.25% 线性分位数，对应 Bonferroni 的 0.05 / 4，逻辑成立。四项比较共享 S，不要求它们彼此独立才能应用 Bonferroni。
                - paragraph [ref=f5e1357]: 但 40 群的百分位 bootstrap 仍是有限样本近似。Bonferroni 不会把近似覆盖变成精确保证，20,000 次重采样也不会增加独立群数或证明功效充分。
                - paragraph [ref=f5e1358]: 某候选只有在：
                - list [ref=f5e1359]:
                  - listitem [ref=f5e1360]: A/B 两个调整后下界都严格大于 0；
                  - listitem [ref=f5e1361]: 三个预定 seed × 两域的六个点差也都严格大于 0；
                - paragraph [ref=f5e1362]: 时才通过该协议的双域排序门。后一条件进一步收紧裁决，不提供 seed 总体概率保证。
                - paragraph [ref=f5e1363]:
                  - text: 若最终通过，可支持的主张是：
                  - strong [ref=f5e1364]: 在固定 A→B 任务、冻结生成机制、同额有限调参预算和三条预定训练轨迹下，该候选对调参后的 S，在新留出群的两域 B 末 raw MAP 上获得协议规定的条件支持。
                - paragraph [ref=f5e1365]: 它不自动支持任意 seed、其他到达顺序、真实市场、概率质量改善、已证明的遗忘机制，或方法创新。
