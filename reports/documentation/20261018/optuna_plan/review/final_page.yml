                - paragraph [ref=f5e760]: lambda_rank ∈ [0.25, 2]、lr_multiplier ∈ [0.5, 2] 包含默认锚点，维度少，干预含义明确。lambda 不含 0，也使本轮保持在调节既有 rank 的问题内。
