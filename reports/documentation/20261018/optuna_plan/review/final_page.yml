                  - text: 以旧双臂外层 12661 / 2 = 6330.5 秒估算，45 次为
                  - strong [ref=f5e1222]: 79.13125 小时
                  - text: ，算术没有错误；它只是按旧入口成本作粗估，不包括另外列出的阶段，也不是新单 trial 的资源准入证明。
                - paragraph [ref=f5e1223]: 两项需要补清：
                - list [ref=f5e1224]:
                  - listitem [ref=f5e1225]:
                    - strong [ref=f5e1226]: 九次复验后的集中评价计入哪里。
                    - text: 不能在前八次外层已经结束后，既不计后续评价，也不能把等待其余运行的时间重复算成训练。可在现有 3300 秒或复验 81000 秒中明确预留，总额保持不变。
                  - listitem [ref=f5e1227]:
                    - strong [ref=f5e1228]: 新的 9000 秒上限尚无旧资格直接支持。
                    - text: 保存的旧双臂保守投影为 38079.876088 秒，旧 PASS 是在旧限额内成立。这个数字不能证明新运行必然超时，但足以说明旧 PASS 不能迁移成新的 9000 秒单次资格。
                - paragraph [ref=f5e1229]: 若后续合法投影不能满足新上限，就不能按现范围启动正式搜索。不能靠临时缩安全系数、把 Optuna timeout 当硬截止，或用粗估均值替代资格依据。失败消费实际 slot、时间和读取账，停止而不自动补抽的规则应保留。
                - heading "六、新 80 群与最终统计规则，支持的是明确而有限的确认" [level=2] [ref=f5e1230]
