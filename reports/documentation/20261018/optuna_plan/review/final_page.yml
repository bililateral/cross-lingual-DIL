                - heading "锚点、startup 和八个 TPE 点的安排自洽" [level=3] [ref=f5e767]
                - paragraph [ref=f5e768]: Optuna 4.6.0 的 TPE 根据已完成的试验状态判断是否仍处于 startup。这里不剪枝、失败即停，真实执行完成的默认锚点可以计入四个 startup，因此可以实现：
                - list [ref=f5e769]:
                  - listitem [ref=f5e770]: trial 0：固定默认锚点；
                  - listitem [ref=f5e771]: trial 1—3：三个随机启动点；
