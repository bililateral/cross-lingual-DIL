                - heading "2. 每个代理的实际支撑与不足" [level=3] [ref=e992]
                - paragraph [ref=e993]: "**C：72 次权重身份读取有实际代码来源。**36 个成功搜索各两个端点，父控制在留证删除前做身份读取，因此不能只按轻量 ask/tell 估计。14 秒是完整手写 SQLite 36 槽测试的外层保守收费，实际外层为 13.257703867 秒；加 72R、120 秒未测工作余量和 1.25，支持 C900。证据：scripts/step28_optuna_search.py:196–203、236–244，attempt01 wrapper 和 tests/test_step28_optuna.py:159–186。"
                - paragraph [ref=e994]: 不足在于 R 是恢复测量，不是直接 hash 吞吐量测量，且可能受热缓存影响；14 秒也不是完整 45 次正式控制阶段。因此它是工程代理，不是未来文件系统负载下的逐文件上界。
                - paragraph [ref=e995]: "**E：9 倍旧双臂尾段具有保守尺度依据。**当前集中评价对应 54 套端点指标／计数、108 个诊断捕获和 18 次权重身份读取。旧双臂有 24 个捕获，新每 run 为 12 个；每个新 run 都分配一次旧双臂完整尾段而不除以 2，保守方向明确。尾段还包含最后端点和退出，而非纯评价。证据：scripts/step28_optuna_run.py:317–339、scripts/step28_positive_ranking_run.py:261–328，历史 job.console.txt:107 与 wrapper、completion 保存字段。"
                - paragraph [ref=e996]:
                  - text: 26 秒是 attempt07 完整外层，实际为 25.194099902 秒，确实包含九份手写群指标／统计以及 45 保存槽独立分析。但 tests/test_step28_optuna.py:251–268 直接构造了诊断曲线，
                  - strong [ref=e997]: 没有执行全部 108 个正式捕获的诊断评价
                  - text: 。因此 26 秒不能单独证明完整 E；同类完整诊断成本主要由旧尾段支持。加上 18R、300 秒未测余量及 1.25，可接受 E3600。
                - paragraph [ref=e998]: "**A：实际独立分析核心已在 45 个手写保存槽上执行。**保存结果记有 36090 个核对字段，未新增 optimizer 调用、载模或正式标签读取。用包含其他检查的完整 26 秒，再加 120 秒和 1.25，支持维持 A600。证据：tests/test_step28_optuna.py:289–306 与 attempt07 的 saved_evaluation.json。"
                - paragraph [ref=e999]:
                  - text: 这 45 个槽是合成保存材料，不是 45 条真实训练轨迹；保存级分析也不等于重新从标签独立重建全部指标。以上属于
                  - strong [ref=e1000]: B07 解释限制
                  - text: ，不形成要求先跑正式锚点或九复验的准入循环。
