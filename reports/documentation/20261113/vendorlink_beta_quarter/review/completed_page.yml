                              - generic [ref=f5e500]: "stat_text = Path(f'/proc/{pid}/stat').read_text()"
                              - generic [ref=f5e501]: "except FileNotFoundError as error:"
                              - generic [ref=f5e502]: raise psutil.NoSuchProcess(pid) from error
                              - generic [ref=f5e504]: fields = stat_text.rsplit(') ', 1)[1].split()
                              - generic [ref=f5e505]: "# 后续保留原start_ticks解析及boot_id读取。"
                            - button [aria-hidden]
                        - paragraph [ref=f5e506]: "不要宽泛吞掉所有`OSError`，也不要把权限错误、格式错误、`boot_id`不可读或活进程身份不符变成正常退出。该修法不放松身份核验，也不授权任何实验重试。"
                        - paragraph [ref=f5e507]: "**最小补证：**用手写CPU元数据夹具模拟“Process对象已取得、随后该PID的stat消失”，检查中文完整闭合时可继续按完成回执判断；尚未闭合时仍拒绝；外部承诺已退出时记为`exited`而不产生控制器全局异常。无需BERT、GPU或正式数据。"
                        - heading "BQ-R02：中文主批次已完成但监管已退出、缺最终收尾回执时，等待器仍继续空等" [level=3] [ref=f5e508]
                        - paragraph [ref=f5e509]:
