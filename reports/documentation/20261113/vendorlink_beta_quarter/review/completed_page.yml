                        - paragraph [ref=f5e511]:
                          - strong [ref=f5e512]: 具体源码：
                          - text: "`S/step35_vendorlink_beta_wait.py::dependency_observation`已计算`live`。在中文主`completion.json`不存在时，第38行开始会正确判断监管是否仍活着；但第51行的“监管`state/completion.json`不存在”分支直接返回`WAITING_CHINESE_SUPERVISOR_CLOSURE`，没有再次检查`live`。"
                        - paragraph [ref=f5e513]: "这不是没有实际生产者依据的假设。包内`B/review/dependency_sources/step28_h_ablation_pause.py::takeover`第297行先等待`controller.execute()`返回，第299行才写监管完成回执；`step28_h_ablation_control.py::execute`第202行先写主批次完成回执。因此存在“主回执已有、监管回执尚未写”的明确窗口。"
                        - paragraph [ref=f5e514]: "**触发路径：**监管在这个窗口被SIGKILL或崩溃，来不及留下failure文件。之后监管已经退出、成为zombie或PID身份改变，等待器仍反复返回可等待状态，累积活动检查费用，直到辅助预算门触发。"
                        - paragraph [ref=f5e515]: "**影响限定：**它不会在缺少监管完成回执时提前开训，也不会污染训练结果；问题是把应明确终止的依赖状态误保留为等待状态，与合同要求的失败/身份变化留证终止不符。〔B/scope.zh.md 第36行〕"
                        - paragraph [ref=f5e516]: "**最小修法：**监管完成回执缺失时，只有`live=True`才继续等；`live=False`则抛出明确的“中文监管未完整收尾即退出或身份改变”错误，由现有等待失败记录处理，并保持不自动重试。示意："
