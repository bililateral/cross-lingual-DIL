                        - heading "6.2 原失败门另报，没有被响应门覆盖" [level=3] [ref=f5e751]
                        - paragraph [ref=f5e752]: "beta_comparison()先调用原比较逻辑，将完整结果保留在`original_gates`。原`decide()`仍分别计算：SEQ明显遗忘均值3.5pp及种子条件；Full−SEQ的O/F各3pp及稳定性；Full−ER的O/F各2pp及相应保护；绝对能力、初学、新域和外部比较。`old_score_increment_conditions`继续独立输出。〔S/step35_vendorlink_account_policy.py::deterministic_comparison、decide〕"
                        - paragraph [ref=f5e753]:
                          - text: 因此，
                          - strong [ref=f5e754]: 新响应通过可以与原强门失败同时成立
                          - text: 。只恢复到ER附近时，可以报告减轻额外约束代价，不能宣布出生保持具有额外价值。无论本次响应好坏，返回值均关闭confirm、application和automatic_followup。〔B/scope.zh.md §3；S/step35_vendorlink_account_policy.py::beta_comparison；S/step35_vendorlink_account_control.py::pipeline〕
                        - heading "6.3 R11/R12与完整指标的解释边界" [level=3] [ref=f5e755]
                        - paragraph [ref=f5e756]: "代码单列同seed的R11/R12差异，任何非零差异都会置`interpretation_requires_identity_review=True`。这要求结果解释前核对来源与未改路径，不能归因于尚未发生的β干预。该自动flag检查的是主宏F1；不能把它说成自动完成了全部13指标的预干预一致性审查。完整指标已由评分分析器保存，结果审查可据此继续核对。〔S/step35_vendorlink_account_policy.py::beta_comparison；S/step35_vendorlink_account_evaluate.py::analyze〕"
                        - paragraph [ref=f5e757]: 必须同时报告Q、O、带符号F、两个旧域各自遗忘、GB/GC和全部13指标。因F＝Q−O，若Δ表示新值减对照，则“遗忘减少＝ΔO−ΔQ”；这是恒等式，不是两项独立因果贡献。每query只有一个正确账号时，MAP＝MRR，Top1＝micro-F1＝Recall@1＝NDCG@1，不能当成多份独立胜利。〔S/step35_vendorlink_account_policy.py::summarize；S/step35_vendorlink_account_evaluate.py::metrics〕
                        - heading "七、保存对照身份、完整评分与一次开放" [level=2] [ref=f5e758]
                        - heading "7.1 对照复用具有实际检查入口" [level=3] [ref=f5e759]
                        - paragraph [ref=f5e760]: "deterministic_baseline()逐个绑定原P/M的gate、batch、裁决/完成、budget和results，检查固定任务、seed、数据manifest、预训练引用及原裁决。`beta_reference()`再检查最新确定性Full的协议、相同P/M来源、数据/预训练、三任务及完整比较结果。`permit()`实际调用这些函数；CPU核验也真实调用了保存对照读取，而非只用合成结果替代。〔S/step35_vendorlink_account_control.py::permit、deterministic_baseline、beta_reference；Q/verify.py第88行开始〕"
                        - paragraph [ref=f5e761]: 相关旧权重已按此前许可删除，但已保存指标仍可在同协议下复用。当前新训练从共同预训练冷启动，新评分只加载本批新端点，没有通过已删旧模型续训或重新评分的路径。〔N/background.zh.md §6；S/step35_vendorlink_account_run.py::make_model、restore〕
                        - paragraph [ref=f5e762]: "**网页核验的边界：**本包包含已开放比较数字和旧审查原文；原P/M及确定性运行的部分原gate、batch、原评分清单、数据与预训练载荷仅有路径/大小/SHA引用，没有全部随包提供。我确认的是绑定逻辑、包内数字和CPU03记载的Linux来源检查；没有独立读取服务器上每份被引用载荷，也没有重新核验已删权重或原预测矩阵。现有材料未出现需要索取这些载荷才能解决的具体矛盾，不将其变成补件或全历史重验要求。"
                        - heading "7.2 全批完整后评分、评分完整后一次分析" [level=3] [ref=f5e763]
                        - paragraph [ref=f5e764]: "实际顺序为：冻结三任务→全部训练成功→写`training_complete.json`→串行完成三个评分任务→写`scoring_complete.json`→单CPU分析一次。`run_many()`只要仍有失败或缺项，就抛错关闭下游。〔S/step35_vendorlink_account_control.py::campaign.run_phase；S/step30_evolution_control.py::Runner.run_many〕"
                        - paragraph [ref=f5e765]: "训练验收检查任务、identity、stage0/1/2/3端点及必要计数。评分前核整批训练清单；分析前核整批评分清单。评价器要求九格R01/R11/R12/R21/R22/R23/R31/R32/R33、全部FIT12矩阵与对应角色来源完整，拒绝重复分析目录，并写`opening='whole_batch_once'`。本批正常完成后应有27格、351个新指标值。〔S/step35_vendorlink_account_control.py::worker、validate_training；S/step35_vendorlink_account_evaluate.py::validate_scores、analyze〕"
                        - paragraph [ref=f5e766]: 这里“盲评分”是评分阶段不先计算和开放科学指标。评分器仍须检查查询与档案账号映射和文本互斥关系，不能说程序对账号排列完全不知情。训练worker只读当前fit和存活Memory；评分role固定为dev，本β路径不进入confirm或新增应用输出。〔S/step35_vendorlink_account_control.py::worker；S/step35_vendorlink_account_evaluate.py::score〕
                        - heading "八、三槽资源、故障处置与42小时预算" [level=2] [ref=f5e767]
                        - heading "8.1 CPU分配和GPU/RAM准入" [level=3] [ref=f5e768]
                        - paragraph [ref=f5e769]: "Runner.command()已改为从父进程允许核心中取最后`2*workers`个，再按槽分成两个核；三槽要求至少六个允许核心。CPU03真实子进程使用了`[0,1]`、`[2,3]`、`[4,5]`。正式等待启动命令必须保留至少六核亲和性，不能复用CPU01的两核包装。〔S/step30_evolution_control.py::Runner.command；Q/cpu03/receipt.json〕"
                        - paragraph [ref=f5e770]: "资源逻辑对本批未体现GPU承诺扣除`max(0, reserve−NVML已观察占用)`，对已登记外部GPU承诺也做身份核对与扣账；本批RAM按每槽20GiB减已观察RSS的待体现额扣除，实际RSS上限16GiB。新身份采用start_ticks/boot_id，create_time只作旧格式兼容。〔S/step30_evolution_control.py::resource_observation；S/step35_vendorlink_account_policy.py::BETA_LIMITS〕"
                        - paragraph [ref=f5e771]: "**5GiB是逐槽准入预留，不是整PID显存硬帽，也没有allocator硬配额。**最多三槽不保证始终能同时派出三条，资源不足时可以逐槽等待。旧单路采样峰值和CPU03都不能保证三路长期峰值或13小时内一定完成。〔B/scope.zh.md §4；S/step35_vendorlink_account_control.py::configure_compute；D/qualification/gpu01/receipt.json〕"
                        - paragraph [ref=f5e772]: 磁盘准入保留12GiB本批输出帽、启动/派发空闲64GiB、运行空闲32GiB和每个活跃保存的2GiB预留。运行阶段持续检查RSS、磁盘与生命周期；没有发现把磁盘占用误当显存占用的接线。〔S/step30_evolution_control.py::resource_observation、Runner.run_many；S/step35_vendorlink_account_io.py::Check〕
                        - heading "8.2 条件性现场前提：外部RAM承诺" [level=3] [ref=f5e773]
                        - paragraph [ref=f5e774]: "现资源函数对RAM待体现额只遍历本批`owned`；`other_gpu_commitments`进入的是GPU扣账，没有对应外部RAM预留字段。故不能笼统声称“所有已核实外部GPU/RAM未来承诺均已扣除”。〔S/step30_evolution_control.py::resource_observation，第31行与第53行〕"
                        - paragraph [ref=f5e775]: "当前准备门的外部承诺列表为空，本包没有证明现场存在某个未体现的外部RAM承诺。**这不列为无条件第三项阻断。**正式部署时应确认实际有无此类承诺；若存在，就把已核实的RAM预留纳入`max(0, reserved_ram−RSS)`扣账，或等该承诺释放后准入。若不存在，记录该现场前提即可。无需建立全局锁或通用资源平台。"
