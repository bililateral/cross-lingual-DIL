                        - heading "BQ-R01：正常进程退出时，新增内核身份读取可能误触发整个等待或调度失败" [level=3] [ref=f5e460]
                        - paragraph [ref=f5e461]:
                          - strong [ref=f5e462]: "分类：`REPRODUCIBILITY_DEFECT`；部署前必修。"
                        - paragraph [ref=f5e463]:
                          - strong [ref=f5e464]: 具体源码：
                        - list [ref=f5e465]:
                          - listitem [ref=f5e466]: "S/step30_evolution_control.py::kernel_identity，第21行开始，直接读取`/proc/{pid}/stat`。"
                          - listitem [ref=f5e467]: "S/step35_vendorlink_beta_wait.py::dependency_observation，第29行开始，先创建`psutil.Process`，再调用上述函数；异常分支只捕获`psutil.NoSuchProcess`。"
                          - listitem [ref=f5e468]: S/step30_evolution_control.py::resource_observation，第54行开始，对具名承诺进程采取同样的异常处理。
                          - listitem [ref=f5e469]: S/step35_vendorlink_beta_wait.py::wait_then_run，第110行开始，将漏出的异常记为失败并退出；一次性等待目录阻止自动重新开始。
                          - listitem [ref=f5e470]: S/step30_evolution_control.py::Runner.run_many，第339行开始，控制器异常进入本批活动任务清理。
                        - paragraph [ref=f5e471]: "**触发路径：**中文监管进程，或已经登记的外部资源承诺进程，在`psutil.Process(pid)`构造成功以后、读取`/proc/{pid}/stat`以前正常退出并被其父进程回收。原始文件读取会抛出`FileNotFoundError`，并非`psutil.NoSuchProcess`。于是程序跳过本来已有的“进程已退出”处理。"
                        - paragraph [ref=f5e472]: 在等待器中，即使中文整批及监管都已合法完成，也可能被写成不可自动重试的等待失败。在资源观察中，若正式门登记了恰好退出的外部承诺进程，该异常可能传入Runner，连带终止已经启动的健康任务。
                        - paragraph [ref=f5e473]: "**限定：**这是源码可确定的异常类型缺口和可能的竞态路径；本轮没有证据表明它已经在服务器发生。也不应泛称每个自有worker正常退出都会触发：直接子进程通常由同一父进程`poll`回收并从活动表移除，回收前还可能保留为zombie。中文监管和具名外部进程已足以构成此发现。"
                        - paragraph [ref=f5e474]: "**最小修法：**仅在读取该PID的`stat`文件时，将明确的文件消失归一为调用方已经处理的`psutil.NoSuchProcess`。例如以下局部处理思路："
                        - generic [ref=f5e476]:
                          - generic [ref=f5e477]:
                            - generic [ref=f5e480]: Python
                            - generic [ref=f5e481]:
