                      - paragraph [ref=e1637]: 因此，新池必须先明确全局账号索引、query 真值映射、逐市场宏 F1 的支持集合、无正 query 类的处理以及汇总权重。若所有1578类 query 一起算，虽然没有上述上限，却变成账号等权，不能静默替代原来旧域等权的 Q/O/F。
