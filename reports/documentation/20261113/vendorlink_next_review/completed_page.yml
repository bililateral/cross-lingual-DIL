                      - separator [ref=e1600]
                      - heading "三、主要问题一：统一候选池没有足够理由优先执行" [level=2] [ref=e1601]
                      - heading "1. 当前缺的是独立需求依据" [level=3] [ref=e1602]
                      - paragraph [ref=e1603]: 提案明确承认，没有“查询市场未知”或“必须统一检索”的实际部署需求证据。当前市场已知，本市场候选已经覆盖所定义的精确账号识别任务。〔N/proposal_as_submitted.zh.md §2；N/background.zh.md §3〕
                      - paragraph [ref=e1604]: "**我的推断是：市场筛选是现任务合法可用的信息。**若只是为了增加难度而要求方法忽略它，得到的是另一种压力条件，不能因为候选更多就称其更贴近应用。"
                      - paragraph [ref=e1605]: 跨市场候选可能多数是容易负例，也可能引入有意义的混淆；附件没有原始数据支持其中任一项已经发生。对单正例排序，如果新增候选都在正确账号之后，甚至不会改变正确账号的排名。
                      - paragraph [ref=e1606]: 因此，我接受一次有限、不训练的需求核实，但它必须允许得出“没有理由继续”的结论。需要回答的是：
                      - list [ref=e1607]:
                        - listitem [ref=e1608]: 查询来自什么业务过程，市场信息是否可用？
                        - listitem [ref=e1609]: 要找的是原观察账号，还是不同账号背后的同一控制者？
                        - listitem [ref=e1610]: 为什么必须面对统一档案？
                        - listitem [ref=e1611]: 这种检索错误有什么实际代价？
                      - paragraph [ref=e1612]:
                        - strong [ref=e1613]: 当前没有这些依据，就应停止统一池建议，不为它继续找顺序、时期或账号子集。
                      - heading "2. 账号标签不足以证明同控，但不使账号任务自动无效" [level=3] [ref=e1614]
                      - paragraph [ref=e1615]:
                        - text: 使用无碰撞的“市场＋观察账号”全局索引，可以定义跨市场候选中的
                        - strong [ref=e1616]: 精确账号识别
                        - text: 。两个账号即使可能属于同一控制者，在这个任务中仍可以是不同类别。
                      - paragraph [ref=e1617]: 但不能把这种类别差异转写成“不同真实控制者”的负标签，也不能把精确账号识别错误直接称作马甲关系错误。若统一池真正要回答跨账号同控检索，现有监督不够；若仍是精确账号识别，就需要说明为什么放弃已知市场条件。〔N/background.zh.md §1；scripts/step35_vendorlink_account_run.py::groups_for〕
                      - heading "3. V_CLS 不能直接拼成一个全局对手" [level=3] [ref=e1618]
                      - paragraph [ref=e1619]: 实际 classification() 使用一个市场的类别集合及其旧分类头。多个市场各自 softmax 后的概率拼接，不会自动成为已校准的全局类别概率；早期端点也没有未来市场已经训练好的头。〔scripts/step35_vendorlink_account_evaluate.py::classification、score；scripts/step35_vendorlink_account_run.py::execute〕
                      - paragraph [ref=e1620]: 若未来统一池有独立价值，可以考虑：
                      - list [ref=e1621]:
                        - listitem [ref=e1622]: 以相容的 V_SET 做统一检索比较，同时保留 V_CLS 的原市场条件结果；
                        - listitem [ref=e1623]: 或另行定义全局分类/跨头校准规则。
                      - paragraph [ref=e1624]: 后一种做法会改变外部方法及开发成本，已经不再是“只改候选池”。不能把缺少全局定义的旧 V_CLS 硬拼成弱对照，再据此宣称 Full 优势。
                      - heading "4. 新协议还有一个具体的宏 F1 风险" [level=3] [ref=e1625]
                      - paragraph [ref=e1626]:
                        - strong [ref=e1627]: 这是新提案直接复用评价器时的未来风险，不是旧实现的缺陷。
                      - paragraph [ref=e1628]: 当前：
                      - list [ref=e1629]:
                        - listitem [ref=e1630]: analyze() 取候选列数 n，以 np.arange(n) 构造真值，隐含查询和候选是同序账号全集。
                        - listitem [ref=e1631]: metrics() 对全部候选类平均 F1；既无真值 query、又无预测的类也赋0参与平均。
                      - paragraph [ref=e1632]: 这适用于当前每市场方阵。若将 Dream 的157个查询接到全部1578个候选：
                      - list [ref=e1633]:
                        - listitem [ref=e1634]: 原样使用时，会因真值长度与矩形分数形状不符而拒绝；
                        - listitem [ref=e1635]: 若只修真值映射、仍保留全候选宏平均，即使 Dream 查询全部正确，宏 F1 上限也仅为：
