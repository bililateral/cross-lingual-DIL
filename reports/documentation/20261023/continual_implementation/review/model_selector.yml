                              - text: 真实更新、Adam连续状态、Memory／教师来源、三个阶段权重、端点校准及真正保存恢复证据仍须保留。
                              - strong [ref=e1277]: 不需要恢复全部旧诊断。
                              - text: 〔报告§4；B02〕
