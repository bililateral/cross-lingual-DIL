                        - paragraph [ref=e669]:
                          - text: 这些小时数沿用原拟每条AB搜索6h、每条完整路径10h，
                          - strong [ref=e670]: 都是累计任务额度，不是并行工期，也不是新实测
                          - text: 。暂时保留原27.5h全部非训练桶时，两臂和三臂版本的总额示例分别为207.5h和297.5h；最终非训练预算仍应按所选评价矩阵与实现具体化。三seed是有价值的稳健性选择，不能当成数学必需或功效保证。〔提案第83、99、131—140行；交付包 mechanical_checks.json、design_comparison.csv〕
                        - heading "各臂删除后的结论代价" [level=3] [ref=e671]
                        - list [ref=e672]:
                          - listitem [ref=e673]:
                            - strong [ref=e674]: S与H_pos必须保留
                            - text: ：它们构成预先唯一主要比较。不能为省算力削弱S、给S套用候选参数，或共享已经训练的首阶段模型。
                          - listitem [ref=e675]:
                            - strong [ref=e676]: SEQ取决于是否需要本批场景诊断
                            - text: ：删除后可以引用历史无记忆遗忘证据，但不能声称本批已经重新验证该现象。用于这一诊断时，无须强迫它新增12次搜索。
                          - listitem [ref=e677]:
                            - strong [ref=e678]: LOGIT取决于是否增加强基线主张
                            - text: ：可使用冻结历史版本，也可单独给它12次搜索；两者的公平性措辞不同。只有后者才支持该项“同两维、同12次机会”的比较表述。
                          - listitem [ref=e679]:
                            - strong [ref=e680]: ER、S_pos可从核心删除
                            - text: ：代价分别是缺少本批普通重放比较、缺少新的三阶段rank/pooling系统分解，不会破坏H_pos−S主要比较。
                          - listitem [ref=e681]:
                            - strong [ref=e682]: 原H和R0当前不必补跑
                            - text: ：它们对应更具体的机制问题。原H缺席限制完整交互解释；R0历史对照可以复用，也不能把含历史项的R0当成无记忆SEQ。〔提案第53—64、73—77行；10月11日归因报告第23—29行〕
                        - heading "二、并行能加速，但要保持哪些条件" [level=2] [ref=e683]
                        - paragraph [ref=e684]:
                          - strong [ref=e685]: 独立的方法×顺序×seed完整路径可以并行。单条路径的stage1→stage2→stage3必须顺序执行
                          - text: ，因为后阶段依赖本路径前阶段模型、Adam、RNG、Memory和出生教师。多卡优先采用
                          - strong [ref=e686]: 一GPU一完整路径
                          - text: ，无需引入分布式训练框架，也无需改变batch、LR或实验数量。〔提案第76、83—89行〕
                        - paragraph [ref=e687]:
                          - text: 若保留多个独立Optuna study，可以跨study并行；
                          - strong [ref=e688]: 每个study内部仍须维持：
                        - blockquote [ref=e689]:
                          - paragraph [ref=e690]: ask → 完整运行及反馈核对 → tell → 下一次ask
                        - paragraph [ref=e691]: 同一study提前ask多个trial、一次预采样全部12点或引入新的并行采样语义，都会改变原自适应选参协议。零HPO精简方案则无需实现这部分调度。〔提案第73—77行；step28_optuna_control.py第125—190行〕
                        - paragraph [ref=e692]: 现有代码的实质限制已经查明：
