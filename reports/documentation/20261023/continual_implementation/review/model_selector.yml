                            - paragraph [ref=e1392]: 这应与最终旧域表现共同展示，避免把初学优势直接叫抗遗忘，也避免用低取得水平换来的小 F 声称机制成功。
                            - paragraph [ref=e1393]:
                              - text: H_pos−S 要求
                              - strong [ref=e1394]: O 改善和 F 减少同时通过
                              - text: ，属于共同终点的交并要求；不必仅因两个共同终点机械追加 Holm。N／Z 点估计保护仍然只是观察保护，
                              - strong [ref=e1395]: 不是统计非劣
                              - text: ，也不保证每个阶段、每条路径都无损。〔提案§七；报告§5〕
                            - paragraph [ref=e1396]:
                              - text: 其余六个预定对比作为
                              - strong [ref=e1397]: 探索性系统位置比较
                              - text: ，足以满足当前基线目标。若以后明确要求逐个确认 H 胜过多个基线，最简修改可以是在开放前固定：
                            - paragraph [ref=e1398]:
                              - strong [ref=e1399]: H−S → H−LOGIT → H−ER → H−SEQ
                            - paragraph [ref=e1400]: 首个失败后停止后续确认性宣称，其余结果仍完整报告。这不需要增加训练或 HPO；当前没有必要自动加入这套规则。〔报告§5.6；B04〕
                            - paragraph [ref=e1401]:
                              - text: 此外，“SEQ 退化伴随学习”最好按
                              - strong [ref=e1402]: 同一 run、同一次转换
                              - text: 并列 D2／G2、D3／G3。现有评分格已经足够，不需新增数据或评分。仅集合平均 F、G 各为正，不能自动推成每条路径或同次转换都同时发生。〔报告§5.4；B03〕
                            - paragraph [ref=e1403]: 三循环、三固定 seed、同生成器新120群的条件性也应继续保留：它们不是全部六顺序、训练 seed 总体、独立新训练场景或真实市场证据。
                            - heading "5. 实施前真正需要落实的条件" [level=2] [ref=e1404]
                            - paragraph [ref=e1405]:
                              - text: 结构化报告共
                              - strong [ref=e1406]: 11 项意见
                              - text: ，其中
                              - strong [ref=e1407]: 5 项是正式运行前的实施或资源条件
                              - text: 。它们没有被误记为尚未实施的新代码已经出错。
                            - paragraph [ref=e1408]: 最关键的条件是：
                            - list [ref=e1409]:
                              - listitem [ref=e1410]:
                                - strong [ref=e1411]: 共享池实际额度必须同时进入父、子两层。
                                - text: 旧子进程 Budget(job) 仍默认21600秒，即6小时；只改父进程为24小时会保留错误的内层截止。派发必须原子保证“已结算费用＋全部活跃完整预留≤450h”，失败、恢复和退出尾部不能免费或清零。
                              - listitem [ref=e1412]:
                                - strong [ref=e1413]: 五方法必须进入真实运算分支。
                                - text: ER 的0.1历史项、LOGIT独立0.5教师项、S/H 的 rank／汇聚、第三阶段合法 Memory、实际 order／seed 和恢复都要落实；只改断言、方法名或 PASS 日志不够。
                              - listitem [ref=e1414]:
                                - strong [ref=e1415]: 全局开放门按完整 ID 集合核齐。
                                - text: 不能只数45条记录，不能按完成先后错配规格，也不能拿快速成功子集提前开放结果。
                              - listitem [ref=e1416]:
                                - strong [ref=e1417]: 同卡三路必须有获批后的限定并发证据。
                                - text: 需要同时驻留、设备总体峰值和短时聚合吞吐；显存相加“看起来能放下”不是资格通过。
                              - listitem [ref=e1418]:
                                - strong [ref=e1419]: 存储生命周期和全任务 RSS 归属必须兑现。
                                - text: 临时完整状态、原子替换、失败残留以及 controller／辅助进程不能漏计。
                            - paragraph [ref=e1420]:
                              - text: 这些都可以在最小 controller 和现有入口上完成，不需要 DDP、通用实验平台或全仓回归。
                              - strong [ref=e1421]: 36 次 optimizer 调用／5400秒是整个资格的上限，不是每个 worker 一份，也不是必须花满的工作量。
                              - text: 〔报告§6—9；B05—B09〕
