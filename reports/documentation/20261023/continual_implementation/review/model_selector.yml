                        - heading "N/Z、群bootstrap和外推边界" [level=3] [ref=e797]
                        - list [ref=e798]:
                          - listitem [ref=e799]:
                            - text: N/Z点估计非负是预定观察性保护，
                            - strong [ref=e800]: 不是统计非劣证明
                            - text: ；“确定无损”措辞应收窄。
                          - listitem [ref=e801]: 两个平均保护都满足，也不保证第二阶段、每个域或每个seed都无损；应披露已有逐格损益，不另加“每格必须胜”总门。
                          - listitem [ref=e802]: 按实际域整群抽样、跨方法/阶段/seed/order复用同一群索引，基本符合配对依赖结构；同一群被重复评分不能算成更多独立群。
                          - listitem [ref=e803]: 三个固定seed不支持训练seed总体置信推断；40群/域没有给定效应的功效保证，允许结论不确定。
                          - listitem [ref=e804]: ABC/BCA/CAB使各域首中末位置平衡，但相邻方向只覆盖A→B、B→C、C→A。新120群支持同生成机制、固定训练流下的新群确认，不能升级为独立新训练场景或真实市场验证。〔提案第82、99、103—117行〕
