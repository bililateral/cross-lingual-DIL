                          - text: 。这属于明确的局部增量，不要求通用调度平台或全量重做旧验证。〔step28_optuna_control.py第53—116、135—190、209—216行；step28_optuna_search.py第198—225、260—291、374—401行；step28_optuna.py第60—65行〕
